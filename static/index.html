<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"}}</script>
<link rel="stylesheet" href="/static/pixel-ui.css"><link rel="stylesheet" href="/static/pixel-hud.css"></head>
<body class="talk"><div id="canvas-container"></div>
<div class="px" id="px" data-state="idle" data-conv="0">
  <header class="px-top">
    <button class="px-icon glass" id="menu" title="Menu" aria-label="Open menu">☰</button>
    <div class="px-pill glass"><b>PIXEL</b><span class="px-sep"></span><span class="px-engine" id="engineName">Cascade</span></div>
    <div class="px-pill glass" role="status"><span class="px-dot"></span><span id="stateLabel">Ready</span></div>
    <div class="px-spacer"></div>
    <div class="px-pill glass px-metric" title="Time from the end of your sentence to Pixel’s first sound"><span>Reply delay</span><b id="latency">—</b></div>
    <button class="px-icon glass" id="reset" title="Forget this conversation" aria-label="Forget this conversation">↺</button>
  </header>
  <aside class="px-convo glass" id="convo" aria-label="Conversation" aria-live="polite">
    <div class="px-label">You</div>
    <div id="transcript"></div>
  </aside>
  <footer class="px-dock" id="rightPanel">
    <div class="chip-row">
      <button class="chip" data-prompt="What should we talk about today?">Conversation starter</button>
      <button class="chip" data-prompt="Tell me something surprising.">Surprise me</button>
      <button class="chip" data-prompt="Tell me a short joke.">Make me laugh</button>
    </div>
    <div class="px-bar glass">
      <form class="px-form" id="textForm"><input id="textInput" placeholder="Type a message…" autocomplete="off" aria-label="Type a message"><button class="send" type="submit" aria-label="Send">➤</button></form>
      <button class="px-mic" id="talk" title="Start or stop the conversation" aria-label="Start or stop the conversation" aria-pressed="false"><span class="mic-core"></span></button>
    </div>
    <div class="px-hint" id="hint">Tap the mic to start talking · you can interrupt any time</div>
  </footer>
  <span id="status" class="px-sr">STANDBY // READY</span>
</div>
<script src="/static/pixel-ui.js"></script><script type="module" src="/static/pixel-life.js"></script><script src="/static/fast-chat.js"></script><script src="/static/pipecat-webrtc.js"></script><script src="/static/realtime.js"></script><script src="/static/talk.js"></script>
</body></html>
