<style>
:root{color-scheme:dark;font:16px Rajdhani,system-ui,sans-serif;--red:#e74c3c;--amber:#f39c12;--panel:#160b0acc;--line:#e74c3c55}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#050202;color:#e2e8f0;letter-spacing:.02em}#canvas-container{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#4a1d16 0,#170b0b 45%,#050202 82%)}#canvas-container:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#000b 100%);pointer-events:none}canvas{width:100%;height:100%;display:block}.hud{position:relative;z-index:2;width:100%;height:100%;padding:1.25rem 1.5rem;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.glass{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 40px #000b,inset 0 1px #fff0a}header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}.brand,.right,.bottom,.chip-row,.text-form{pointer-events:auto}.brand{display:flex;gap:.75rem;align-items:center}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:var(--red);font-size:1.35rem}.eyebrow{font:700 .68rem ui-monospace,monospace;letter-spacing:.2em;color:#a9a1a1}.title{margin:.1rem 0;font:800 1.2rem Orbitron,ui-monospace,sans-serif;letter-spacing:.12em;text-shadow:0 0 12px #e74c3caa}.badge{font:.65rem ui-monospace,monospace;color:var(--amber);border:1px solid #f39c1266;padding:.18rem .4rem;border-radius:5px}.connection{font:.7rem ui-monospace,monospace;color:#a9a1a1}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 9px var(--red);margin-right:.35rem}.right{display:flex;flex-direction:column;align-items:flex-end;gap:.75rem;width:min(100%,390px)}.controls{display:flex;gap:.65rem;align-items:center}.icon-btn,.mic-btn{color:#d2c2c2;cursor:pointer}.icon-btn{width:42px;height:42px;border-radius:50%;font-size:1.1rem}.mic-btn{position:relative;width:68px;height:68px;border:0;border-radius:50%;background:transparent}.mic-btn:before{content:'';position:absolute;inset:-5px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--amber));filter:blur(8px);opacity:.7;animation:glow 2.4s infinite}.mic-core{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:#080606ee;border:1px solid var(--red);color:var(--red);font-size:1.45rem}.right.listening .mic-core{color:#ffd09c;border-color:var(--amber)}.feed{width:min(100%,390px);padding:1rem;border-radius:18px;border-right:2px solid var(--red)}.feed-head{display:flex;justify-content:flex-end;gap:.4rem;color:#958a8a;font:.65rem ui-monospace,monospace;letter-spacing:.12em}.feed-head i{color:var(--red)}#transcript{margin-top:.55rem;min-height:2.2rem;color:#f3dddd;font:.88rem ui-monospace,monospace;text-align:right}.wave{height:13px;display:flex;justify-content:flex-end;gap:4px;margin-top:.5rem;opacity:.35}.wave i{width:3px;border-radius:2px;background:var(--red);animation:wave .7s ease-in-out infinite alternate}.wave i:nth-child(2){height:80%;animation-delay:.2s}.wave i:nth-child(3){height:100%;animation-delay:.35s}.wave i:nth-child(4){height:55%;animation-delay:.1s}.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}.chip-row{display:flex;gap:.45rem;flex-wrap:wrap;max-width:650px}.chip,.send{border:1px solid var(--line);color:#d9caca;background:#160b0acc;cursor:pointer}.chip{border-radius:11px;padding:.5rem .7rem;font:.7rem ui-monospace,monospace}.chip:hover,.send:hover,.icon-btn:hover{border-color:var(--red);color:#fff;background:#401512aa}.text-form{display:flex;width:min(100%,330px);padding:.35rem;border-radius:15px}.text-form input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:.45rem;font:.78rem ui-monospace,monospace}.send{width:34px;height:34px;border-radius:10px;color:var(--amber)}button:disabled{opacity:.5}@keyframes glow{50%{opacity:1;transform:scale(1.05)}}@keyframes wave{to{height:100%;opacity:1}}@media(max-width:700px){.hud{padding:.8rem}.title{font-size:1rem}.brand{transform:scale(.9);transform-origin:left top}.right{width:58%}.bottom{align-items:stretch;flex-direction:column}.text-form{width:100%}.chip-row{max-width:none}}
</style><link rel="stylesheet" href="/static/alien-theme.css"></head><body><div id="canvas-container"></div><div class="hud"><header><div class="brand"><div class="logo glass">◉</div><div><div class="eyebrow">LOCAL VOICE COMPANION</div><div class="title">PIXEL <span class="badge">VRM LINK</span></div><div class="connection"><span class="dot"></span><span id="status">STANDBY // READY</span></div></div></div><div class="right" id="rightPanel"><div class="controls"><button class="icon-btn glass" id="reset" title="Reset conversation">↺</button><button class="mic-btn" id="talk" title="Start conversation"><span class="mic-core">●</span></button></div><div class="feed glass"><div class="feed-head"><i>●</i><span>VOICE COMM FREQUENCY</span></div><div id="transcript">Tap the glowing orb or choose a prompt to speak…</div><div class="wave"><i></i><i></i><i></i><i></i></div></div><div class="emotes glass"><button class="emote" data-gesture="wave">1 Wave</button><button class="emote" data-gesture="shrug">2 Shrug</button><button class="emote" data-gesture="celebrate">3 Cheer</button><button class="emote" data-gesture="bow">4 Bow</button><button class="emote" data-gesture="nod">5 Nod</button><button class="emote" data-gesture="shake">6 Shake</button><button class="emote" data-gesture="surprise">7 Wow</button></div></div></header><div class="bottom"><div class="chip-row"><button class="chip" data-prompt="What should we talk about today?">◈ Conversation starter</button><button class="chip" data-prompt="Tell me something surprising.">✦ Surprise me</button><button class="chip" data-prompt="Tell me a short joke.">◌ Make me laugh</button></div><form class="text-form glass" id="textForm"><input id="textInput" placeholder="Transmit text message…" autocomplete="off"><button class="send" type="submit">➤</button></form></div></div>
<script>
const $=id=>document.getElementById(id);let audioContext,input,processor,output,stream,chunks=[];let voiceMode=false,captureActive=false,speechStarted=false,silenceMs=0,busy=false;let recognition,recognitionActive=false,captionTimer,lastCaptionSent='';function setStatus(s){$('status').textContent=s;$('rightPanel').classList.toggle('listening',s.includes('LISTEN')||s.includes('HEARING'))}function setupCaptions(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';recognition.onresult=e=>{let display='',finalText='';for(let i=e.resultIndex;i<e.results.length;i++){display+=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=e.results[i][0].transcript}if(display.trim()&&voiceMode&&!busy)$('transcript').textContent=display.trim();if(finalText.trim()&&voiceMode&&!busy&&finalText.trim()!==lastCaptionSent){lastCaptionSent=finalText.trim();clearTimeout(captionTimer);captionTimer=setTimeout(()=>sendCaptionedText(finalText.trim()),350)}};recognition.onend=()=>{if(recognitionActive&&voiceMode)try{recognition.start()}catch(_){}}}function connect(){if(!processor||captureActive)return;input.connect(processor);processor.connect(output);captureActive=true}function disconnect(){if(!processor||!captureActive)return;input.disconnect(processor);processor.disconnect(output);captureActive=false}
async function start(){if(voiceMode||busy)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});audioContext=new AudioContext();await audioContext.resume();input=audioContext.createMediaStreamSource(stream);processor=audioContext.createScriptProcessor(4096,1,1);output=audioContext.createGain();output.gain.value=0;processor.onaudioprocess=e=>{if(!captureActive||busy)return;const d=e.inputBuffer.getChannelData(0);let sum=0;for(let i=0;i<d.length;i++)sum+=d[i]*d[i];const rms=Math.sqrt(sum/d.length),frame=d.length/audioContext.sampleRate*1000;if(rms>.006){if(!speechStarted){setStatus('HEARING YOU // CAPTURING');$('transcript').textContent='Listening for words…'}speechStarted=true;silenceMs=0}else if(speechStarted)silenceMs+=frame;if(speechStarted)chunks.push(new Float32Array(d));if(speechStarted&&silenceMs>=650)sendUtterance()};voiceMode=true;recognitionActive=true;chunks=[];speechStarted=false;silenceMs=0;connect();if(recognition)try{recognition.start()}catch(_){}setStatus('LISTENING // VOICE LINK OPEN');$('talk').title='Stop conversation'}catch(_){setStatus('MICROPHONE ACCESS REQUIRED')}}async function stop(){voiceMode=false;recognitionActive=false;if(recognition)recognition.stop();disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());if(audioContext)await audioContext.close();stream=input=processor=output=audioContext=null;chunks=[];setStatus('STANDBY // READY');$('talk').title='Start conversation'}async function playAudio(b64){if(!audioContext)return;const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),buffer=await audioContext.decodeAudioData(bytes.buffer),source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);await new Promise(resolve=>{source.onended=resolve;source.start()})}
async function reply(text){if(!text)return;setStatus('PROCESSING // THINKING');const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}),chat=await r.json();document.getElementById('reply')?.remove();const out=document.createElement('div');out.id='reply';out.textContent=chat.reply||'No reply received.';out.style.cssText='margin-top:.55rem;color:#f3dddd;font:.88rem ui-monospace,monospace;text-align:right';$('transcript').parentElement.append(out);if(chat.audio){setStatus('SPEAKING // AUDIO LINK');window.animateSpeaking?.(true);await playAudio(chat.audio);window.animateSpeaking?.(false)}}async function sendCaptionedText(text){if(busy||!voiceMode)return;busy=true;disconnect();$('transcript').textContent=text;try{await reply(text)}catch(e){setStatus('LINK ERROR // '+e.message)}busy=false;if(voiceMode){setStatus('LISTENING // VOICE LINK OPEN');connect()}}async function sendUtterance(){if(busy||!speechStarted)return;busy=true;speechStarted=false;silenceMs=0;disconnect();const rate=audioContext.sampleRate,parts=chunks;chunks=[];const size=parts.reduce((n,x)=>n+x.length,0),audio=new Float32Array(size);let at=0;for(const p of parts){audio.set(p,at);at+=p.length}if(audio.length<rate*.15){busy=false;if(voiceMode)connect();return}try{setStatus('TRANSCRIBING // WHISPER');const r=await fetch('/api/stt',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Sample-Rate':String(rate)},body:audio}),text=(await r.json()).text||'';$('transcript').textContent=text||'No speech detected.';if(text)await reply(text)}catch(e){setStatus('LINK ERROR // '+e.message)}busy=false;if(voiceMode){setStatus('LISTENING // VOICE LINK OPEN');connect()}}
$('talk').onclick=()=>voiceMode?stop():start();$('reset').onclick=async()=>{await fetch('/api/reset',{method:'POST'});$('transcript').textContent='Conversation buffer cleared.';document.getElementById('reply')?.remove()};$('textForm').onsubmit=async e=>{e.preventDefault();const text=$('textInput').value.trim();$('textInput').value='';try{await reply(text)}catch(err){setStatus('LINK ERROR // '+err.message)}};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>reply(b.dataset.prompt));setupCaptions();fetch('/api/config').then(r=>r.json()).catch(()=>{});
</script><script type="module" src="/static/pixel-life.js"></script><script src="/static/fast-chat.js"></script><script src="/static/realtime.js"></script></body></html>
