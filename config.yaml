# ---------------------------------------------------------------
#  Talking Buddy config. Edited live: no restart needed for most changes.
# ---------------------------------------------------------------
character:
  name: "Pixel"
  system_prompt: |
    You are {name}, a warm, witty, casual companion who lives on the user's laptop.
    Talk like a friend: one short, natural sentence for simple questions and at most two short sentences for anything else. No lists, no markdown, no emojis.
    If you don't know something, say so. You have no internet unless web results
    are included in the message.

brain:
  # Ollama's OpenAI-compatible endpoint. For LM Studio use http://localhost:1234/v1
  base_url: "http://localhost:11434/v1"
  model: "gemma3:4b"             # smaller and faster for voice conversation
  api_key: "local"
  temperature: 0.7
  max_tokens: 72
  history_turns: 2
  think: false
  keep_alive: "30m"

web:
  enabled: true                # internet is used ONLY when one of these phrases is said
  triggers: ["search the web", "search online", "check online", "check the internet",
             "look it up online", "look up online", "google it"]
  max_results: 5

stt:
  whisper_repo: "mlx-community/whisper-small-mlx"   # fast local fallback; use large-v3-turbo for maximum accuracy
  language: "en"

tts:
  engine: "kokoro"             # local neural voice; falls back to macOS say if unavailable
  say_voice: "Samantha"     # warm, natural macOS fallback
  say_rate: 182              # gentle but conversational pacing
  kokoro_voice: "af_bella"  # warm, bright, friendly character voice
  speed: 1.02

voice:
  # Pipecat/WebRTC is the primary path; the existing WebSocket pipeline remains
  # the automatic local fallback when browser or provider startup fails.
  transport: "pipecat"
  fallback_transport: "websocket"

server:
  port: 8000
